<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ title }}</title>
  <meta name="description" content="{{ description }}" />
  <meta property="og:title" content="{{ title }}" />
  <meta property="og:description" content="{{ description }}" />
  <meta property="og:type" content="website" />
  <link rel="canonical" href="{{ request.base_url }}{{ request.url.path.lstrip('/') }}" />
  <link rel="stylesheet" href="/static/css/folio.css" />
</head>
<body>
  <a class="skip" href="#main">跳到正文</a>
  <div class="wrap">
    <header class="site-header">
      <a class="brand" href="/">FOLIO / 折页</a>
      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="nav" data-menu>菜单</button>
      <nav class="nav" id="nav">
        <a href="/recommendations">本期新书推荐</a>
        <a href="/archive">往期推荐</a>
        <a href="/search">书籍检索</a>
      </nav>
    </header>
    <main id="main">
      {% block content %}{% endblock %}
    </main>
    <footer class="footer">
      <p>一起读书，一起交流。如果有什么想交流的，请联系：{{ email }}</p>
      <p>本站仅用于图书介绍与阅读交流，不提供购买服务。</p>
    </footer>
  </div>
  <script>
    const btn = document.querySelector("[data-menu]");
    const nav = document.getElementById("nav");
    if (btn && nav) {
      btn.addEventListener("click", () => {
        const open = nav.classList.toggle("open");
        btn.setAttribute("aria-expanded", open ? "true" : "false");
      });
    }
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
